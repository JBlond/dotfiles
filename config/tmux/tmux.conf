# vim: syntax=tmux
#
# good practice: don't use different aliases for the same command
#   set  --> set-option
#   setw --> set-window-option
#   run  --> run-shell
#   bind --> bind-key
#       -r flag: enable keep hitting bind key without prefix
#       -n flag: enable bind key without prefix
#       -g flag: global
#       -T sets the client's key table; the next key from the client will be interpreted from key-table.
#
# Sections:
#   1. General
#   2. Platform includes
#   3. Key bindings
#   4. Windows and panes
#   5. Theme (status bar, colors, pane borders)
#   6. Terminal (colors, cursor, undercurl, passthrough)


# ======================================================================
# 1. General
# ======================================================================

set -g default-shell /usr/bin/fish

# enable mouse
set -g mouse on

# Start window and pane indices at 1.
set -g base-index 1
set -g pane-base-index 1

# See if this fixes slow ESC issues.
# http://unix.stackexchange.com/questions/23138/esc-key-causes-a-small-delay-in-terminal-due-to-its-alt-behavior
#set -s escape-time 0
set -s escape-time 50

# autoread
set -g focus-events on

# display messages for 2 seconds
set-option -g display-time 2000


# ======================================================================
# 2. Platform includes
# ======================================================================

# clipboard
if-shell "uname | grep -q MINGW64" "source ~/dotfiles/config/tmux/tmux.win.conf"
if-shell "uname | grep -q Linux" "source ~/dotfiles/config/tmux/tmux.linux.conf"


# ======================================================================
# 3. Key bindings
# ======================================================================

# --- copy mode / paste
# enter copy mode. Then CTRL + SPACE for selection. CTRL + w to put the selection into the buffer
bind C-c copy-mode
bind C-v paste-buffer

# --- reload config (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded tmux config.'

# --- command prompt: have command prompt not only on :
bind . command-prompt

# --- switch windows alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# --- move windows with Shift and arrow key
bind-key -n S-Left swap-window -t -1
bind-key -n S-Right swap-window -t +1

# --- pane splitting with Prefix + | and Prefix + -.
# The default ones are % and ", which is highly non-intuitive.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind = select-layout even-vertical

# --- switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- toggle pane synchronization with Prefix + S
bind S set synchronize-panes

# --- F keys
bind -T root F1 new-window
bind -T root F2 next-window
bind -T root F3 previous-window
bind -T root F4 kill-window
bind -T root F5 source-file ~/.config/tmux/tmux.conf \; display 'Reloaded tmux config.'
bind -T root F6 set status
bind -T root F7 new-session
bind -T root F8 detach
bind -T root F9 next-layout

# F11 = toggle mouse on and off
bind -T root F11 set-option -w mouse\; set-option -g mouse

# F12: pass all keys through (e.g. for nested tmux), F12 again switches back
bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    set status-style "fg=colour245,bg=colour238" \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    refresh-client -S

bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    set -u status-style \; \
    refresh-client -S


# ======================================================================
# 4. Windows and panes
# ======================================================================

# rename-window
set -wg allow-rename off
set -wg automatic-rename off

# Automatically re-number windows after one of them is closed.
set -g renumber-windows on


# ======================================================================
# 5. Theme
# ======================================================================

# --- message colors
set -g message-style "bg=#00346e, fg=#ffffd7"  # tomorrow night blue, base3

# --- status bar: general
set-option -g status-position top
set-option -g status-style default
# Every refresh runs shell_icons once per window; the clock only shows minutes.
set -g status-interval 5
set -g status-left-length 400
set -g status-right-length 600

# --- status bar: indicators used in status-right
# Pure tmux formats: no shell process per refresh and the F11/F12 state shows up immediately.
wg_is_mouse_off="#{?mouse,,🖰 }"
PASS_ICON="#{?#{==:#{client_key_table},off},⌥⇄⌥,}"

# --- status bar: left
set -g status-left "#[fg=black,bg=colour214] ❐ #S #[fg=colour214,bg=black,nobold,noitalics,nounderscore]"

# --- status bar: right
set -g status-right "#[fg=colour214,bg=black,nobold,noitalics,nounderscore]#[fg=black,bg=colour214]#{?client_prefix,<Prefix> ,}$wg_is_mouse_off $PASS_ICON #[fg=brightwhite,bg=colour238] %Y-%m-%d %H:%M "

# --- windows in the status bar
# last used window name
set -wg window-status-last-style "fg=white"

# current window style
set-window-option -g window-status-current-style none

# inactive window
set -g window-status-format "#[fg=black,bg=colour238,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] #{window_name} #[fg=white,bg=brightblack]#(shell_icons #{pane_current_command}) #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"

# active window
set -g window-status-current-format "#[fg=black,bg=colour214,nobold,noitalics,nounderscore]#[fg=colour238,bg=colour214] #{window_name} #[fg=brightwhite,bg=colour238] #(shell_icons #{pane_current_command}) #[fg=colour238,bg=black,nobold,noitalics,nounderscore]"

# separator
set -g window-status-separator ""

# --- panes
# current pane is black the others light grey
# set -g window-style 'fg=colour247,bg=colour236'
# set -g window-active-style 'fg=colour250,bg=black'

set -wg pane-border-style "fg=#585858" # base01
set-option -g pane-active-border-style "fg=colour255"
set-option -g display-panes-active-colour colour148

# --- clock color
set-window-option -g clock-mode-colour colour160


# ======================================================================
# 6. Terminal
# ======================================================================

# always use 256 colors
set -g default-terminal 'tmux-256color'

# this is for the cursor shape. 3 = blinking underscore. 1 would be a solid block
set -ga terminal-overrides '*:Ss=\E[%p3%d q:Se=\E[ q'

# Define terminal overrides (note that when adding terminal overrides we use a
# generic `*` catchall because `tmux info` doesn't report `tmux-256color` even
# with the above default-terminal setting).
# Enable 24-bit color support (check if this works via `tmux info | grep Tc`)
set-option -s -a terminal-overrides ",*:Tc"
# Add Undercurl (test it with `printf '\e[4:3mUndercurl\n\e[0m'`)
set-option -s -a terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Add colored undercurl (test it with `printf '\e[4:3;58:2:255:100:0mUndercurl\n\e[0m'`)
set-option -s -a terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# enable yazi image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# THE END 😢
