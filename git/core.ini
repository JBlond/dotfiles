[core]
	autocrlf = input
	commitGraph = true
	editor = nvim
	excludesfile = ~/dotfiles/git/gitignore.ini
	filemode = false
	fscache = true
	fsmonitor = false
	multiPackIndex = true
	pager = delta
	preloadindex = true
	trustctime = false

[feature]
	manyFiles = true

[commitGraph]
	generationVersion = 2

[interactive]
	diffFilter = delta --color-only

[delta]
	dark = true
	navigate = true
	side-by-side = true
	true-color = always
