# vim: syntax=tmux
#
# good practice: don't use different aliases for the same command
#   set  --> set-option
#   setw --> set-window-option
#   run  --> run-shell
#   bind --> bind-key
#       -r flag: enable keep hitting bind key without prefix
#       -n flag: enable bind key without prefix
#       -g flag: global
#       -T sets the client's key table; the next key from the client will be interpreted from key-table.
#
# Layout:
#   tmux.conf   general settings, platform includes, windows/panes, terminal (this file)
#   keys.conf   key bindings
#   theme.conf  status bar, colors, pane borders
#
# Sections in this file:
#   1. General
#   2. Platform includes
#   3. Windows and panes
#   4. Terminal (colors, cursor, undercurl, passthrough)
#   5. Key bindings and theme (sourced from the files above)


# 1. General

set -g default-shell /usr/bin/fish

# enable mouse
set -g mouse on

# Start window and pane indices at 1.
set -g base-index 1
set -g pane-base-index 1

# See if this fixes slow ESC issues.
# http://unix.stackexchange.com/questions/23138/esc-key-causes-a-small-delay-in-terminal-due-to-its-alt-behavior
#set -s escape-time 0
set -s escape-time 50

# autoread
set -g focus-events on

# display messages for 2 seconds
set-option -g display-time 2000


# clipboard
if-shell "uname | grep -q MINGW64" "source ~/dotfiles/config/tmux/tmux.win.conf"
if-shell "uname | grep -q Linux" "source ~/dotfiles/config/tmux/tmux.linux.conf"


# 3. Windows and panes

# rename-window
set -wg allow-rename off
set -wg automatic-rename off

# Automatically re-number windows after one of them is closed.
set -g renumber-windows on

source-file ~/dotfiles/config/tmux/terminal.conf
source-file ~/dotfiles/config/tmux/keys.conf
source-file ~/dotfiles/config/tmux/theme.conf

# THE END 😢
