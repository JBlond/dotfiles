general {
    lock_cmd = pidof hyprlock || hyprlock       # Verhindert mehrfaches Starten
    before_sleep_cmd = loginctl lock-session    # Sperrt den Bildschirm vor dem Standby
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # Schaltet den Monitor nach dem Aufwachen wieder an
}

# 1. Bildschirm nach 5 Minuten (300s) ausschalten UND sperren
listener {
    timeout = 300
    on-timeout = loginctl lock-session && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2. System nach 30 Minuten (1800s) nur im Akkubetrieb suspendieren
listener {
    timeout = 1800
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null)" = "0" ] && systemctl suspend'
}
