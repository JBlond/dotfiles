# vim: syntax=tmux
#
# Theme: status bar, colors, pane borders. Sourced from tmux.conf.
# NOTE: the status/window formats contain Powerline glyphs (U+E0B0, U+E0B2) and need a Nerd Font.
#       Edit those lines with a UTF-8 safe editor; the glyphs look empty in some viewers.

# --- message colors
set -g message-style "bg=#00346e, fg=#ffffd7"  # tomorrow night blue, base3

# --- status bar: general
set-option -g status-position top
set-option -g status-style default
# Every refresh runs shell_icons once per window; the clock only shows minutes.
set -g status-interval 5
set -g status-left-length 400
set -g status-right-length 600

# --- status bar: indicators used in status-right
# Pure tmux formats: no shell process per refresh and the F11/F12 state shows up immediately.
wg_is_mouse_off="#{?mouse,,🖰 }"
PASS_ICON="#{?#{==:#{client_key_table},off},⌥⇄⌥,}"

# --- status bar: left
set -g status-left "#[fg=black,bg=colour214] ❐ #S #[fg=colour214,bg=black,nobold,noitalics,nounderscore]"

# --- status bar: right
set -g status-right "#[fg=colour214,bg=black,nobold,noitalics,nounderscore]#[fg=black,bg=colour214]#{?client_prefix,<Prefix> ,}$wg_is_mouse_off $PASS_ICON #[fg=brightwhite,bg=colour238] %Y-%m-%d %H:%M "

# --- windows in the status bar
# last used window name
set -wg window-status-last-style "fg=white"

# current window style
set-window-option -g window-status-current-style none

# inactive window
set -g window-status-format "#[fg=black,bg=colour238,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] #{window_name} #[fg=white,bg=brightblack]#(shell_icons #{pane_current_command}) #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"

# active window
set -g window-status-current-format "#[fg=black,bg=colour214,nobold,noitalics,nounderscore]#[fg=colour238,bg=colour214] #{window_name} #[fg=brightwhite,bg=colour238] #(shell_icons #{pane_current_command}) #[fg=colour238,bg=black,nobold,noitalics,nounderscore]"

# separator
set -g window-status-separator ""

# --- panes
# current pane is black the others light grey
# set -g window-style 'fg=colour247,bg=colour236'
# set -g window-active-style 'fg=colour250,bg=black'

set -wg pane-border-style "fg=#585858" # base01
set-option -g pane-active-border-style "fg=colour255"
set-option -g display-panes-active-colour colour148

# --- clock color
set-window-option -g clock-mode-colour colour160
