# vim: syntax=tmux
#
# Key bindings. Sourced from tmux.conf after the platform includes.

# --- copy mode / paste
# enter copy mode. Then CTRL + SPACE for selection. CTRL + w to put the selection into the buffer
bind C-c copy-mode
bind C-v paste-buffer

# --- reload config (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded tmux config.'

# --- command prompt: have command prompt not only on :
bind . command-prompt

# --- switch windows alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# --- move windows with Shift and arrow key
bind-key -n S-Left swap-window -t -1
bind-key -n S-Right swap-window -t +1

# --- pane splitting with Prefix + | and Prefix + -.
# The default ones are % and ", which is highly non-intuitive.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind = select-layout even-vertical

# --- switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- toggle pane synchronization with Prefix + S
bind S set synchronize-panes

# --- F keys
bind -T root F1 new-window
bind -T root F2 next-window
bind -T root F3 previous-window
bind -T root F4 kill-window
bind -T root F5 source-file ~/.config/tmux/tmux.conf \; display 'Reloaded tmux config.'
bind -T root F6 set status
bind -T root F7 new-session
bind -T root F8 detach
bind -T root F9 next-layout

# F11 = toggle mouse on and off
bind -T root F11 set-option -w mouse\; set-option -g mouse

# F12: pass all keys through (e.g. for nested tmux), F12 again switches back
bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    set status-style "fg=colour245,bg=colour238" \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    refresh-client -S

bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    set -u status-style \; \
    refresh-client -S
